services:
  backend:
    build: ./backend
    environment:
      S3D_CORS_ORIGIN: http://localhost:5173
      S3D_DATA_DIR: /app/data
      S3D_MODELS_DIR: /app/models
      S3D_VENDOR_DIR: /app/vendor
      S3D_MAX_UPLOAD_MB: 40
      S3D_MAX_PIXELS: 12000000
      S3D_MAX_POINTS: 2000000
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./vendor:/app/vendor
    ports:
      - "8000:8000"
    gpus: all
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: unless-stopped
